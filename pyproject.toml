[project]
name = "autogen-practices"
version = "0.1.0"
description = "Repositorio educativo: AutoGen + Groq (clase de group chat y prácticas de todas sus capacidades)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "autogen-agentchat>=0.7",
    "autogen-ext[openai]>=0.7",
    "python-dotenv>=1.0",
]

[tool.poetry]
# Instalamos solo el paquete `comun/` (helpers compartidos por las prácticas) en modo editable.
packages = [{ include = "comun" }]

[[tool.poetry.source]]
name = "fury"
url = "https://pypi.artifacts.furycloud.io/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
